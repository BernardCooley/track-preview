name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      PUPPETEER_SKIP_DOWNLOAD: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Prisma client
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}

      - run: npm install

      - name: Type check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          POSTGRES_URL: postgres://dummy
          POSTGRES_URL_NON_POOLING: postgres://dummy

      - name: Run tests
        run: npx vitest run

      - name: Bundle size report
        if: github.event_name == 'pull_request'
        run: |
          npx next build 2>&1 | tee /tmp/build-output.txt
          echo '### Bundle Size Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sed -n '/Route/,/^$/p' /tmp/build-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_DEV }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN_DEV }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID_DEV }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Install Vercel CLI
        if: github.event_name == 'push'
        run: npm install -g vercel

      - name: Pull Vercel environment
        if: github.event_name == 'push'
        run: vercel pull --yes --token=$VERCEL_TOKEN

      - name: Set Vercel env vars
        if: github.event_name == 'push'
        run: |
          for VAR_NAME in POSTGRES_URL POSTGRES_URL_NON_POOLING; do
            VAR_VALUE="${!VAR_NAME}"
            for TARGET in preview production; do
              EXISTING=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
                | jq -r ".envs[] | select(.key==\"$VAR_NAME\" and (.target[] | . ==\"$TARGET\")) | .id" | head -1)
              if [ -n "$EXISTING" ]; then
                curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
                  "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$EXISTING?teamId=$VERCEL_ORG_ID" \
                  -d "{\"value\":\"$VAR_VALUE\"}"
              else
                curl -s -X POST -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
                  "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID" \
                  -d "{\"key\":\"$VAR_NAME\",\"value\":\"$VAR_VALUE\",\"type\":\"encrypted\",\"target\":[\"$TARGET\"]}"
              fi
            done
          done
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Build
        if: github.event_name == 'push'
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_FIREBASE_API_KEY_PROD || secrets.NEXT_PUBLIC_FIREBASE_API_KEY_DEV }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PROD || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEV }}
          FIREBASE_AUTH_DOMAIN: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_AUTH_DOMAIN_PROD || secrets.FIREBASE_AUTH_DOMAIN_DEV }}
          FIREBASE_APP_ID: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_APP_ID_PROD || secrets.FIREBASE_APP_ID_DEV }}
          FIREBASE_CLIENT_EMAIL: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_CLIENT_EMAIL_PROD || secrets.FIREBASE_CLIENT_EMAIL_DEV }}
          FIREBASE_PRIVATE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_PRIVATE_KEY_PROD || secrets.FIREBASE_PRIVATE_KEY_DEV }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Deploy
        if: github.event_name == 'push'
        run: vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=$VERCEL_TOKEN

      - name: Merge main into develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git fetch --unshallow origin
          git checkout develop
          git merge origin/main --no-edit
          git push origin develop
